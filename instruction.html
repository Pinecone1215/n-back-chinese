<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <title>N-Back 實驗說明</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/instruction.css" rel="stylesheet">
    <script src="js/instruction.js" defer></script>
</head>

<body>
    <main>
        <div class="cover" hidden>
            <h1>字母 N-Back 遊戲</h1>
            <button id="start-button">實驗說明</button>
        </div>

        <div class="instruction">
            <section>
                <h1>歡迎參加字母N-back 遊戲！</h1>
                <ul>
                    <li>在這項作業中，螢幕上會依序出現不同的字母，每個字母會顯示幾秒鐘。</li>
                    <li>您需要判斷目前出現的字母，是否與前面第N 個出現的字母相同。</li>
                    <li>這項作業包含2-back 和3-back 兩個階段。</li>
                </ul>
            </section>
            <nav class="navigation">
                <button id="back-button">上一頁</button>
                <span id="page-position"></span>
                <button id="next-button">下一頁</button>
            </nav>
        </div>
    </main>
</body>
</html>
