<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <title>N-Back 測驗</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/task.css" rel="stylesheet">
    <script src="./js/task.js" defer></script>
</head>

<body>
    <main>
        <div id="start-screen">
            <p>
                按下「空白鍵」後，將進入全螢幕模式。<br>
                測驗進行期間請保持全螢幕，並盡量不要切換至其他視窗。
            </p>
            <button disabled>請按空白鍵</button>
        </div>

        <div id="stimulus-screen" hidden>
            <p class="letter" hidden></p>
            <p class="fixation" hidden>+</p>
        </div>

        <div id="msg-screen" hidden>
            <h1>感謝您的參與！<br>您已完成字母 N-back 作業。</h1>
            <ul>
                <li>接下來將進行最後一項記憶作業，大約需要 15 分鐘完成。</li>
                <li>您可以在這裡休息幾分鐘。</li>
                <li>休息期間，請不要關閉或重新整理頁面。</li>
                <li>準備好後，請點選「繼續」開始最後一項記憶作業。</li>
            </ul>
            <button id="continue">繼續</button>
        </div>
    </main>
</body>
</html>
